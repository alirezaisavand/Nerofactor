# E10 versioned native A derivative; original scientific YAML remains immutable.
name: bear_A_core_v1
network: material
database_name: real/bear/raw_1024
mesh: data/meshes-pretrained/real/bear.ply
reg_diffuse_light: false
reg_diffuse_light_lambda: 0.1
reg_mat: false
shader_cfg:
  diffuse_sample_num: 512
  specular_sample_num: 1024
  outer_light_version: sphere_direction
  light_exp_max: 5.0
  inner_light_exp_max: 5.0
  human_lights: true
  anisotropy: true
  reg_change: false
  random_azimuth: true
  regularization_version: disabled_v1
  reg_lambda1: 0.05
  reg_energy_loss: false
  reg_spec_loss: false
  reg_energy_loss_lambda: 0.05
  reg_spec_loss_lambda: 0.05
n_lobes: 1
loss:
- nerf_render
- mat_reg
val_metric:
- mat_render
key_metric_name: psnr
train_dataset_type: stage_variant_dummy_v1
dataset_dir: data/GlossyReal
train_dataset_cfg:
  database_name: real/bear/raw_1024
val_set_list:
- name: val
  type: dummy
  cfg:
    database_name: real/bear/raw_1024
optimizer_type: adam
lr_type: warm_up_cos
lr_cfg:
  end_warm: 1000
  end_iter: 100000
total_step: 100000
val_interval: 2000
save_interval: 2000
train_log_step: 10
