# Fresh sphere replay only; ignored historical fields are diagnosed in config.original.yaml and the run report.
name: sphere_corrected_core_v1
network: material
database_name: nerf/sphere
mesh: /inputs/thesis/meshes/sphere_shape-300000.ply
is_nerf: true
reg_diffuse_light: true
reg_diffuse_light_lambda: 0.01
reg_mat: true
shader_cfg:
  diffuse_sample_num: 512
  specular_sample_num: 1024
  outer_light_version: direction
  light_exp_max: 20
  inner_light_exp_max: 20
  human_lights: false
  anisotropy: true
  regularization_version: legacy_v1
  reg_change: true
  change_eps: 0.02
  change_type: gaussian
  reg_lambda1: 0.05
  random_azimuth: true
  reg_energy_loss: true
  reg_energy_loss_lambda: 0.05
  reg_spec_loss: true
  reg_spec_loss_lambda: 0.05
  is_real: false
  illumination_mode: learned_native
  indirect_mode: native_learned
loss:
- nerf_render
- mat_reg
val_metric:
- mat_render
key_metric_name: psnr
train_dataset_type: dummy
dataset_dir: /inputs/datasets/nerf_synthetic
train_dataset_cfg:
  database_name: nerf/sphere
  dataset_dir: /inputs/datasets/nerf_synthetic
val_set_list:
- name: val
  type: dummy
  cfg:
    database_name: nerf/sphere
    dataset_dir: /inputs/datasets/nerf_synthetic
optimizer_type: adam
lr_type: warm_up_cos
lr_cfg:
  end_warm: 1000
  end_iter: 100000
total_step: 100000
val_interval: 2000
save_interval: 2000
train_log_step: 10
material_variant: A_corrected_core_v1
random_seed: 6033
worker_num: 8
novel_view_interval: 10000
