name: vase_material

####network#####
network: material
database_name: real/vase/raw_1024
mesh: data/meshes-pretrained/real/vase.ply

reg_diffuse_light: true
reg_diffuse_light_lambda: 0.1
reg_mat: true
shader_cfg:
  diffuse_sample_num: 512
  specular_sample_num: 1024
  outer_light_version: sphere_direction
  light_exp_max: 5.0
  inner_light_exp_max: 5.0
  human_lights: true

# Changed here
reg_energy_loss: true
reg_energy_loss_lambda: 0.01 # Changed here from 0.01 to 0.001
reg_spec_loss: true
reg_spec_loss_lambda: 0.01 # Changed here from 0.01 to 0.001
n_lobes: 2

######loss######
loss: ['nerf_render','mat_reg']
val_metric: ['mat_render']
key_metric_name: psnr

####dataset#####
train_dataset_type: dummy
dataset_dir: data/GlossyReal
train_dataset_cfg:
  database_name: real/vase/raw_1024
val_set_list:
  -
    name: val
    type: dummy
    cfg:
      database_name: real/vase/raw_1024

####trainier####
optimizer_type: adam
lr_type: warm_up_cos
lr_cfg:
  end_warm: 1000
  end_iter: 100000
total_step: 100000
val_interval: 2000
save_interval: 2000
train_log_step: 10
