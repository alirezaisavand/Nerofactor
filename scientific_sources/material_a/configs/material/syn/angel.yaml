name: angel_material

####network#####
network: material
database_name: syn/angel
mesh: data/meshes-pretrained/syn/angel.ply
anisotropy: true

reg_diffuse_light: true
reg_diffuse_light_lambda: 0.1

# Changed here
reg_energy_loss: false
reg_energy_loss_lambda: 0 # Changed here from 0.01 to 0.001

reg_spec_loss: false
reg_spec_loss_lambda: 0 # Changed here from 0.01 to 0.001

reg_mat: true
shader_cfg:
  diffuse_sample_num: 512
  specular_sample_num: 1024
  outer_light_version: direction
  light_exp_max: 5.0
  inner_light_exp_max: 5.0
  human_lights: false

######loss######
loss: ['nerf_render','mat_reg']
val_metric: ['mat_render']
key_metric_name: psnr

####dataset#####
train_dataset_type: dummy
dataset_dir: data/GlossySynthetic
train_dataset_cfg:
  database_name: syn/angel
val_set_list:
  -
    name: val
    type: dummy
    cfg:
      database_name: syn/angel

####trainier####
optimizer_type: adam
lr_type: warm_up_cos
lr_cfg:
  end_warm: 1000
  end_iter: 100000
total_step: 100000
val_interval: 2000
save_interval: 2000
train_log_step: 10
